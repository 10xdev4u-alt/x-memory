<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>x-memory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav aria-label="Zones" id="zone-nav" role="tablist">
      <button aria-controls="library" aria-selected="true" data-zone="library" role="tab">Library</button>
      <button aria-controls="reader" aria-selected="false" data-zone="reader" role="tab" tabindex="-1">Reader</button>
      <button aria-controls="paper" aria-selected="false" data-zone="paper" role="tab" tabindex="-1">Paper</button>
    </nav>
    <main id="library" aria-label="Library" role="tabpanel"></main>
    <section id="reader" aria-label="Reader" hidden role="tabpanel"></section>
    <section id="paper" aria-label="Paper" hidden role="tabpanel"></section>
    <div id="account-bar">
      <button id="account-current" type="button">Account</button>
      <ul id="account-list" hidden></ul>
    </div>
    <div hidden id="palette" role="dialog" aria-label="Commands">
      <input id="palette-input" type="text" placeholder="Type a command" aria-label="Command search" />
      <ul id="palette-list" role="listbox" aria-label="Commands"></ul>
    </div>
    <script src="panel.js" type="module"></script>
  </body>
</html>
