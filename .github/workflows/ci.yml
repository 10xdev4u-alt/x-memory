name: ci

on:
  pull_request: null
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - run: npm run verify
      - name: Record verified artifact hashes
        run: |
          mkdir -p artifact-hashes
          find dist dist-server release -type f -print0 | sort -z | xargs -0 sha256sum > artifact-hashes/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-artifacts
          path: |
            dist
            dist-server
            release
            artifact-hashes
